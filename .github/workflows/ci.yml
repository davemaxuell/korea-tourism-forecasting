name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python: "3.12"
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install locked environment
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen ruff check src tests
      - name: Format
        run: uv run --frozen ruff format --check src tests
      - name: Test raw rebuild, temporal contracts, and artifacts
        run: uv run --frozen pytest --cov=korea_tourism --cov-report=term-missing --cov-report=xml --cov-fail-under=85

  reproduce:
    name: Full reference experiment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Rebuild and evaluate all candidates
        run: uv run --frozen korea-tourism reproduce
      - name: Upload generated evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reference-experiment
          path: reports/
          if-no-files-found: error
